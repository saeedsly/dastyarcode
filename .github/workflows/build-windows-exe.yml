name: build-windows-exe

# Builds dist\Dastyar\Dastyar.exe on real Windows runners and attaches a zip to
# the GitHub Release.  Trigger it manually from the Actions tab, or push a tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["arena/**"]   # TEMP: verify the build before release

permissions:
  contents: write

jobs:
  build:
    # Windows Server 2022 image + Python 3.8: the produced binaries use only
    # APIs present since Windows 7 SP1, so the same zip runs on 7/8/8.1/10/11.
    name: exe (Windows 7 SP1 .. 11, x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          architecture: x64

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==5.13.2"

      - name: Run tests first (never ship a broken exe)
        run: python scripts/ci_tests.py --verbose

      - name: Build
        run: pyinstaller --noconfirm --clean dastyar.spec

      - name: Smoke test the exe (bundled server must answer)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\Dastyar\Dastyar.exe").Path
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $size bytes"
          Write-Host "::notice::exe built, $size bytes"

          $env:DASTYAR_DATA = Join-Path $env:RUNNER_TEMP "dd-smoke"
          $log = Join-Path $env:RUNNER_TEMP "dastyar.log"
          $p = Start-Process -FilePath $exe `
            -ArgumentList "serve","--port","8599","--no-browser" `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru

          $ok = $false
          $last = ""
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) {
              Write-Host "::error::the exe exited immediately with code $($p.ExitCode)"
              break
            }
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8599/api/health" -TimeoutSec 2
              if ($r.StatusCode -eq 200) {
                Write-Host "health: $($r.Content)"
                Write-Host "::notice::health ok: $($r.Content)"
                $ok = $true
                break
              }
            } catch { $last = $_.Exception.Message }
          }

          if (-not $ok) {
            Write-Host "::error::no answer on 8599 (last: $last)"
            foreach ($f in @($log, "$log.err")) {
              if (Test-Path $f) {
                Get-Content $f -Tail 40 | ForEach-Object { Write-Host "log| $_" }
                Get-Content $f -Tail 6 | ForEach-Object { Write-Host "::error::log| $_" }
              }
            }
          } else {
            try {
              $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8599/" -TimeoutSec 5
              $font = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8599/fonts/vazirmatn-regular.woff2" -TimeoutSec 5
              Write-Host "index: $($page.RawContentLength) bytes, font: $($font.RawContentLength) bytes"
              Write-Host "::notice::UI ok ($($page.RawContentLength) bytes), font ok ($($font.RawContentLength) bytes)"
              if ($page.RawContentLength -lt 2000 -or $font.RawContentLength -lt 1000) { $ok = $false }
            } catch {
              Write-Host "::error::UI/font request failed: $($_.Exception.Message)"
              $ok = $false
            }
          }

          Start-Process -FilePath "taskkill" -ArgumentList "/F","/T","/PID",$p.Id -Wait -ErrorAction SilentlyContinue
          if (-not $ok) { throw "bundled server/UI did not answer on port 8599" }
          Write-Host "OK: exe serves API + UI + Persian font"

      - name: Add launcher + readme to the package
        shell: pwsh
        run: |
          Copy-Item installer\Dastyar.cmd dist\Dastyar\ -Force
          Copy-Item installer\Doctor.cmd  dist\Dastyar\ -Force
          Copy-Item README.md             dist\Dastyar\ -Force
          @"
          دستیار — نسخه‌ی قابل حمل (Portable)
          ====================================
          ۱) روی Dastyar.exe دوبار کلیک کن.
          ۲) اگر ویندوز هشدار SmartScreen داد: More info -> Run anyway
          ۳) در صفحه‌ی تنظیمات یک کلید رایگان (OpenRouter / Gemini / Groq) بگذار.
          داده‌ها: %APPDATA%\Dastyar
          "@ | Out-File -Encoding utf8 dist\Dastyar\شروع-کن.txt

      - name: Zip the package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Dastyar\* `
            -DestinationPath "Dastyar-win-x64.zip" -Force

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Dastyar-win-x64
          path: |
            Dastyar-win-x64.zip
            ${{ runner.temp }}/dastyar.log*
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Dastyar-win-x64.zip
          generate_release_notes: true
