name: tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.8 keeps proving the "runs on old Windows" promise; 3.13 is the future
        python: ["3.8", "3.11", "3.13"]
        exclude:
          # actions/python-versions no longer ships 3.8 for the newest images
          - os: ubuntu-latest
            python: "3.8"
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - name: Compile all modules (catches syntax errors on old Pythons)
        run: python -m compileall -q dastyar tests

      - name: Run unit + end-to-end tests (no dependencies)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface the failure as a GitHub annotation so it can be read
            # even when raw logs are unavailable
            echo "::error::test failures follow"
            python - <<'PYEOF'
          import re
          try:
              lines = open("tests.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              raise SystemExit(0)
          hits = [l for l in lines if re.match(r"^(FAIL|ERROR):", l)]
          for line in hits[:10]:
              print("::error file=tests,title=test failure::" + line[:300])
          tail = [l for l in lines if l.startswith(("AssertionError", "Traceback", "  File"))][:20]
          for line in tail:
              print("::error::" + line[:300].replace("\n", " "))
          PYEOF
          fi
          exit "$status"

      - name: Upload test log (always, even when red)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tests.log
            *.txt
          if-no-files-found: ignore

      - name: Publish the failure reason in the job summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Test failure details"
            echo '```'
            grep -E -A 12 "^(FAIL|ERROR):" tests.log | head -80 || echo "no FAIL/ERROR lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLI smoke test
        shell: bash
        run: |
          python -m dastyar --version
          python -m dastyar tools > tools.txt 2>&1
          head -5 tools.txt
          python -m dastyar config provider demo
          export DASTYAR_DATA="$RUNNER_TEMP/dd"
          python -m dastyar doctor > doctor.txt 2>&1 || true
          head -20 doctor.txt
          # exe/windowed builds have no console; make sure that path is safe too
          python -c "import sys; sys.stdout=None; sys.stderr=None; import dastyar.config as c; c.enable_console_safety(); print('ok')"

      - name: Build sdist/wheel
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v5
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/*
