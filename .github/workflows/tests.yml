name: tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.8 keeps proving the "runs on old Windows" promise; 3.13 is the future
        python: ["3.8", "3.11", "3.13"]
        exclude:
          # actions/python-versions no longer ships 3.8 for the newest images
          - os: ubuntu-latest
            python: "3.8"
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - name: Compile all modules (catches syntax errors on old Pythons)
        run: python -m compileall -q dastyar tests

      - name: Run unit + end-to-end tests (no dependencies)
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        shell: bash
        run: |
          python -m dastyar --version
          python -m dastyar tools > tools.txt
          head -5 tools.txt
          python -m dastyar config provider demo
          export DASTYAR_DATA="$RUNNER_TEMP/dd"
          python -m dastyar doctor > doctor.txt || true
          head -20 doctor.txt

      - name: Build sdist/wheel
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v5
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/*
